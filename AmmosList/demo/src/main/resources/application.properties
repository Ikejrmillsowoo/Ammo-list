spring.application.name=spellingforammo

# --- DataSource (Postgres) ---
#spring.datasource.url=jdbc:postgresql://localhost:5432/ammoworddb
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=app
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# --- Hikari (optional) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initializationFailTimeout=0

# --- Flyway off for now ---
spring.flyway.enabled=true
spring.flyway.schemas=app
spring.flyway.default-schema=app


# --- H2 console OFF (you?re on Postgres) ---
spring.h2.console.enabled=false

# Server
server.address=0.0.0.0
server.port=8080
